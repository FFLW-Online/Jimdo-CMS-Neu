media:
  input: assets/images
  output: assets/images

content:
  - name: startseite
    label: "Startseite"
    type: file
    path: index.html
    format: html/frontmatter
    fields:
      - name: title
        label: "Hauptüberschrift"
        type: string
      - name: intro
        label: "Einleitungstext"
        type: textarea
      - name: hero_image
        label: "Titelbild / Hauptbild"
        type: image
      - name: body
        label: "Haupttext der Seite"
        type: rich-text